<div class="container">

  <!-- LOGIN SCREEN -->
  <div *ngIf="!isLoggedIn" class="login-box">
    <h2>Enter Chat</h2>

    <input
      [(ngModel)]="username"
      placeholder="Enter username"
      class="input"
    />

    <button (click)="login()" class="btn">
      Join Chat
    </button>
  </div>

  <!-- CHAT SCREEN -->
  <div *ngIf="isLoggedIn" class="chat-box">

    <div class="messages">
      <div
        *ngFor="let msg of messages"
        class="message"
        [class.own]="isOwnMessage(msg)"
      >
        <div class="meta">
          <strong>{{ msg.user }}</strong>
        </div>

        <div class="text">
          {{ msg.message }}
        </div>
      </div>
    </div>

    <div class="input-area">
      <input
        [(ngModel)]="messageText"
        placeholder="Type a message..."
        class="input"
        (keyup.enter)="sendMessage()"
      />

      <button (click)="sendMessage()" class="btn">
        Send
      </button>
    </div>

  </div>

</div>
